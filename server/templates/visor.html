<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>{{ cancion.titulo }}</title>
<style>
  :root{
    --bg:#0a0a0a; --surface:#141414; --raised:#1f1f1f; --line:#2a2a2a;
    --txt:#ffffff; --txt2:#a3a3a3; --txt3:#666666;
    --gold:#C9A96E; --gold-soft:#2a2418; --gold-ink:#000;
    --lyric-size:18px; --chord-size:17px; --chord-min:21px;
    --ensayo-h:0px;
  }
  body[data-size="xs"]{ --lyric-size:14px; --chord-size:13px; --chord-min:17px; }
  body[data-size="s"] { --lyric-size:16px; --chord-size:15px; --chord-min:19px; }
  body[data-size="m"] { --lyric-size:18px; --chord-size:17px; --chord-min:21px; }
  body[data-size="l"] { --lyric-size:22px; --chord-size:20px; --chord-min:24px; }
  body[data-size="xl"]{ --lyric-size:26px; --chord-size:24px; --chord-min:28px; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,Roboto,sans-serif;line-height:1.5}
  .wrap{height:100dvh;display:flex;flex-direction:column;padding:14px;
    padding-bottom:max(14px,env(safe-area-inset-bottom));transition:height .25s ease}
  body.ensayo-abierto .wrap{height:calc(100dvh - var(--ensayo-h,320px))}

  .topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:10px}
  .song-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .song-title{font-size:17px;font-weight:600;line-height:1.2}
  .tono-chip{display:inline-flex;align-items:center;justify-content:center;
    background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:14px;
    padding:3px 10px;border-radius:6px;font-family:ui-monospace,Menlo,monospace}
  .tono-btn{display:inline-flex;align-items:center;gap:4px;background:var(--gold);color:var(--gold-ink);
    font-weight:700;font-size:14px;padding:4px 11px;border-radius:6px;border:none;cursor:pointer;
    font-family:ui-monospace,Menlo,monospace;line-height:1}
  .tono-btn .cx{font-size:10px;opacity:.7}
  .song-meta{font-size:12px;color:var(--txt2);margin-top:3px}
  .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
  .dots-btn{width:34px;height:30px;border-radius:7px;background:var(--surface);border:1px solid var(--line);
    color:var(--txt2);font-size:18px;line-height:1;cursor:pointer;font-family:inherit}
  .dots-btn:active{background:var(--raised);color:var(--txt)}
  .pos{font-size:12px;color:var(--txt2)}

  .timeline-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;
    padding:0 14px 6px;flex-shrink:0;scrollbar-width:none}
  .timeline-wrap::-webkit-scrollbar{display:none}
  .timeline{display:inline-flex;gap:6px;padding-bottom:4px;white-space:nowrap}
  .pill{display:inline-block;padding:6px 12px;border-radius:7px;font-size:13px;
    color:var(--txt2);background:var(--surface);border:1px solid var(--line);
    cursor:pointer;flex-shrink:0;font-family:inherit;transition:all 0.15s}
  .pill.done{color:var(--txt3)}
  .pill.active{color:#000;background:var(--txt);border-color:var(--txt);font-weight:600}

  .stage{flex:1;overflow-y:auto;background:transparent;border:none;
    border-radius:0;padding:2px 0 0;-webkit-overflow-scrolling:touch}
  .eyebrow{font-size:11px;color:var(--gold);font-weight:600;letter-spacing:1.8px;
    text-transform:uppercase;margin-bottom:8px}
  .perfnote{font-size:13px;color:var(--txt2);font-style:italic;margin-bottom:14px;
    padding:9px 13px;background:var(--raised);border-radius:7px;border-left:2px solid var(--gold)}
  .lyrics .line{display:flex;flex-wrap:wrap;align-items:flex-end;margin-bottom:6px}
  .lyrics .tok{display:inline-flex;flex-direction:column}
  .chord{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:var(--chord-size);font-weight:var(--chord-weight,700);color:var(--chord-color,var(--gold));
    min-height:var(--chord-min);line-height:var(--chord-min);white-space:pre}
  .lyric{font-size:var(--lyric-size);color:var(--txt);line-height:1.35;white-space:pre}
  .inst{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 0}
  .chip{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:var(--chord-size);
    font-weight:700;color:var(--gold);background:var(--gold-soft);
    padding:8px 16px;border-radius:8px;border:1px solid #3d3422}
  .inst-label{font-size:15px;color:var(--txt2);margin-bottom:14px}
  .sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px;margin-bottom:12px}
  .sec:last-child{margin-bottom:2px}
  .sec.active{border-color:var(--gold)}
  .sechead{display:inline-flex;align-items:center;background:var(--raised);
    border-left:3px solid var(--line);border-radius:7px;padding:7px 13px;margin-bottom:10px;
    font-size:11px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;color:var(--txt3)}
  .sec.active .sechead{color:var(--gold);border-left-color:var(--gold)}
  .secnote{font-size:13px;color:var(--txt2);font-style:italic;margin-bottom:12px}

  .nextpreview{flex-shrink:0;margin-top:8px;padding:9px 13px;background:var(--raised);
    border:1px solid var(--line);border-radius:8px;border-left:2px solid var(--gold);
    display:flex;flex-direction:column;gap:2px;overflow:hidden}
  .nextpreview .np-tag{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:1.2px;font-weight:600}
  .nextpreview .np-name{font-size:13px;color:var(--gold);font-weight:600}
  .nextpreview .np-line{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px;margin-top:2px;
    max-height:36px;overflow:hidden}
  .nextpreview .np-tok{display:inline-flex;flex-direction:column;margin-right:6px}
  .nextpreview .np-chord{font-family:ui-monospace,Menlo,monospace;font-size:12px;
    font-weight:700;color:var(--gold);line-height:14px;white-space:pre;opacity:0.9}
  .nextpreview .np-lyric{font-size:13px;color:var(--txt2);line-height:1.2;white-space:pre}
  .nextpreview .np-inst{font-size:12px;color:var(--txt2);font-style:italic}
  .nextpreview .np-end{font-size:13px;color:var(--txt2);font-style:italic}

  .footer{display:flex;gap:6px;align-items:center;margin-top:10px;flex-shrink:0}
  .btn-icon{width:44px;height:46px;border-radius:8px;background:var(--surface);
    border:1px solid var(--line);color:var(--txt);font-size:20px;line-height:1;
    cursor:pointer;font-family:inherit;flex-shrink:0;transition:all 0.15s}
  .btn-icon:hover{border-color:var(--txt2)}
  .btn-icon:active{background:var(--raised);transform:scale(0.97)}
  .btn-icon:disabled{opacity:0.3;cursor:not-allowed}
  .btn-icon.ensayo{background:var(--gold-soft);border-color:#3d3422;font-size:19px}
  .btn-mid{flex:1;min-width:0;background:var(--raised);color:var(--txt);border:1px solid var(--line);
    padding:12px 8px;border-radius:8px;font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all 0.15s}
  .btn-mid:hover{border-color:var(--txt2)}

  /* Hojas (bottom sheets) */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;opacity:0;
    pointer-events:none;transition:opacity .2s}
  .sheet-bg.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:101;background:var(--surface);
    border-top:1px solid var(--line);border-radius:20px 20px 0 0;
    padding:18px 18px calc(22px + env(safe-area-inset-bottom));
    transform:translateY(110%);transition:transform .25s ease;max-height:80vh;overflow-y:auto}
  .sheet.open{transform:translateY(0)}
  .sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .sheet-t{font-size:16px;font-weight:700}
  .sheet-sub{font-size:12px;color:var(--txt2);margin-bottom:14px}
  .sheet-x{background:none;border:none;color:var(--gold);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .tono-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .tono-op{padding:14px 0;text-align:center;background:var(--raised);border:1px solid var(--line);
    border-radius:10px;color:var(--txt);font-weight:700;font-size:16px;cursor:pointer;
    font-family:ui-monospace,Menlo,monospace}
  .tono-op.cur{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
  .tono-orig{margin-top:12px;width:100%;padding:12px;background:transparent;border:1px solid var(--line);
    border-radius:10px;color:var(--txt2);font-size:13px;cursor:pointer;font-family:inherit}
  .size-row{display:flex;align-items:center;gap:16px;justify-content:center;margin-top:8px}
  .size-big{width:64px;height:52px;border-radius:12px;background:var(--raised);border:1px solid var(--line);
    color:var(--txt);font-size:20px;font-weight:700;cursor:pointer;font-family:inherit}
  .size-big:active{background:var(--gold-soft)}
  .size-big:disabled{opacity:.35}
  .size-lbl{font-size:16px;color:var(--gold);font-weight:700;min-width:40px;text-align:center;font-family:ui-monospace,Menlo,monospace}
  /* Tema claro (modo día) del visor */
  body.claro{--bg:#f4f4f6;--surface:#ffffff;--raised:#ececef;--line:#dcdce2;--txt:#15151a;--txt2:#5b5b66;--txt3:#8a8a95}
  body.claro .pill.active{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
  /* Mostrar solo acordes / solo letra */
  body.solo-acordes .lyric{display:none}
  body.solo-letra .chord{display:none}
  /* Grosor de acordes (pesos bien distintos + refuerzo de trazo) */
  body[data-grosor="fino"] .chord{font-weight:400;-webkit-text-stroke:0}
  body[data-grosor="normal"] .chord{font-weight:700;-webkit-text-stroke:0}
  body[data-grosor="grueso"] .chord{font-weight:800;-webkit-text-stroke:0.45px currentColor}
  /* Controles del panel de ajustes */
  .aj-lbl{font-size:11px;color:var(--txt2);text-transform:uppercase;letter-spacing:1.2px;font-weight:600;margin:16px 0 8px}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{flex:1;min-width:72px;background:var(--raised);border:1px solid var(--line);color:var(--txt);
    padding:11px 10px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600}
  .seg button.active{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
  .seg.colores{gap:9px}
  .seg.colores button{flex:0 0 auto;min-width:0;width:34px;height:34px;border-radius:50%;padding:0;border:2px solid var(--line)}
  .seg.colores button.active{border-color:var(--txt)}
  .seg.colores input[type=color]{width:34px;height:34px;border:2px solid var(--line);border-radius:50%;padding:0;background:none;cursor:pointer}
  .seg.colores input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  .seg.colores input[type=color]::-webkit-color-swatch{border:none;border-radius:50%}
  .seg.colores input[type=color]::-moz-color-swatch{border:none;border-radius:50%}
</style>

<script>/*mw-acento*/(function(){try{var s="{{ mi_acento }}";var c=s||localStorage.getItem('mw_acento');if(s){try{localStorage.setItem('mw_acento',s);}catch(_){}}if(c){var d=document.documentElement.style,h=c.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];d.setProperty('--gold',c);d.setProperty('--gold-soft','rgba('+parseInt(h.substr(0,2),16)+','+parseInt(h.substr(2,2),16)+','+parseInt(h.substr(4,2),16)+',0.16)');d.setProperty('--gold-ink',(0.299*parseInt(h.substr(0,2),16)+0.587*parseInt(h.substr(2,2),16)+0.114*parseInt(h.substr(4,2),16))>145?'#000':'#fff');}}catch(e){}})();</script>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="sheet-bg" id="bg-tono" onclick="cerrarTono()"></div>
<div class="sheet" id="sheet-tono">
  <div class="sheet-h"><div class="sheet-t">Tonalidad</div><button class="sheet-x" onclick="cerrarTono()">Listo</button></div>
  <div class="sheet-sub" id="tono-sub"></div>
  <div class="tono-grid" id="tono-grid"></div>
  <button class="tono-orig" id="tono-orig" onclick="irTono(0)">Volver al tono original</button>
</div>

<div class="sheet-bg" id="bg-ajustes" onclick="cerrarAjustes()"></div>
<div class="sheet" id="sheet-ajustes">
  <div class="sheet-h"><div class="sheet-t">Ajustes de vista</div><button class="sheet-x" onclick="cerrarAjustes()">Listo</button></div>

  <div class="aj-lbl">Tamaño de letra</div>
  <div class="size-row">
    <button class="size-big" id="size-minus" onclick="tamanoMenos()">A−</button>
    <span class="size-lbl" id="size-label">M</span>
    <button class="size-big" id="size-plus" onclick="tamanoMas()">A+</button>
  </div>

  <div class="aj-lbl">Tema</div>
  <div class="seg" id="seg-tema">
    <button data-val="oscuro" onclick="setVista('tema','oscuro')">🌙 Oscuro</button>
    <button data-val="claro" onclick="setVista('tema','claro')">☀️ Día</button>
  </div>

  <div class="aj-lbl">Mostrar</div>
  <div class="seg" id="seg-modo">
    <button data-val="ambos" onclick="setVista('modo','ambos')">Ambos</button>
    <button data-val="acordes" onclick="setVista('modo','acordes')">Solo acordes</button>
    <button data-val="letra" onclick="setVista('modo','letra')">Solo letra</button>
  </div>

  <div class="aj-lbl">Color de acordes</div>
  <div class="seg colores" id="seg-color">
    <button data-val="" onclick="setVista('color','')" title="Por defecto" style="background:var(--gold)"></button>
    <button data-val="#ffffff" onclick="setVista('color','#ffffff')" title="Blanco" style="background:#ffffff"></button>
    <button data-val="#ffd23f" onclick="setVista('color','#ffd23f')" title="Amarillo" style="background:#ffd23f"></button>
    <button data-val="#8fd3ff" onclick="setVista('color','#8fd3ff')" title="Celeste" style="background:#8fd3ff"></button>
    <button data-val="#8fe0a0" onclick="setVista('color','#8fe0a0')" title="Verde" style="background:#8fe0a0"></button>
    <button data-val="#ff9d5c" onclick="setVista('color','#ff9d5c')" title="Naranja" style="background:#ff9d5c"></button>
  </div>

  <div class="aj-lbl">Grosor de acordes</div>
  <div class="seg" id="seg-grosor">
    <button data-val="fino" onclick="setVista('grosor','fino')">Fino</button>
    <button data-val="normal" onclick="setVista('grosor','normal')">Normal</button>
    <button data-val="grueso" onclick="setVista('grosor','grueso')">Grueso</button>
  </div>

  <div class="aj-lbl">Color de acento (interfaz)</div>
  <div class="seg colores" id="seg-acento">
    <button data-val="" onclick="setAcento('')" title="Por defecto" style="background:#C9A96E"></button>
    <button data-val="#5B8DEF" onclick="setAcento('#5B8DEF')" title="Azul" style="background:#5B8DEF"></button>
    <button data-val="#3FB950" onclick="setAcento('#3FB950')" title="Verde" style="background:#3FB950"></button>
    <button data-val="#A371F7" onclick="setAcento('#A371F7')" title="Morado" style="background:#A371F7"></button>
    <button data-val="#E5534B" onclick="setAcento('#E5534B')" title="Rojo" style="background:#E5534B"></button>
    <button data-val="#2DB7A3" onclick="setAcento('#2DB7A3')" title="Turquesa" style="background:#2DB7A3"></button>
    <button data-val="#9CA3AF" onclick="setAcento('#9CA3AF')" title="Gris claro" style="background:#9CA3AF"></button>
    <button data-val="#6B7280" onclick="setAcento('#6B7280')" title="Gris" style="background:#6B7280"></button>
    <button data-val="#4B5563" onclick="setAcento('#4B5563')" title="Gris oscuro" style="background:#4B5563"></button>
    <button data-val="#FFFFFF" onclick="setAcento('#FFFFFF')" title="Blanco" style="background:#FFFFFF"></button>
    <input type="color" id="acento-custom-v" title="Color personalizado" onchange="setAcento(this.value)">
  </div>
</div>

<script>
const cancion = {{ cancion|tojson }};
const permitirTransposicion = {{ permitir_transposicion|tojson }};
const semitonosActual = {{ semitonos_actual|tojson }};
const numeroCancion = {{ cancion.numero|tojson }};

const urlParams = new URLSearchParams(window.location.search);
let idx = parseInt(urlParams.get('s') || '0', 10);
if(isNaN(idx) || idx < 0 || idx >= cancion.secciones.length) idx = 0;

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

// ---- Tonalidad ----
const NOMBRES = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
function parseTono(t){
  t=String(t||'C').trim();
  const m=t.match(/^([A-Ga-g])([#b]?)(.*)$/); if(!m) return {base:0,menor:false};
  const nat={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1].toUpperCase()];
  let base=nat + (m[2]==='#'?1:(m[2]==='b'?-1:0));
  base=((base%12)+12)%12;
  return {base, menor:/^m(?!aj)/i.test(m[3])};
}
const ORIG = parseTono({{ tono_original|tojson }});
function nombreTono(semis){
  const i=((ORIG.base+semis)%12+12)%12;
  return NOMBRES[i] + (ORIG.menor?'m':'');
}
function normDelta(d){ d=((d%12)+12)%12; if(d>6) d-=12; return d; }
function irTono(t){ window.location.href = `/cancion/${numeroCancion}?from=bib&t=${t}&s=${idx}`; }

function abrirTono(){
  if(!permitirTransposicion) return;
  const actualIdx = ((ORIG.base + semitonosActual)%12+12)%12;
  document.getElementById('tono-sub').textContent = 'Actual: ' + nombreTono(semitonosActual) + ' · original: ' + nombreTono(0);
  document.getElementById('tono-grid').innerHTML = NOMBRES.map((n,i)=>{
    const delta = normDelta(i - ORIG.base);
    const cur = (i===actualIdx) ? ' cur' : '';
    const etq = n + (ORIG.menor?'m':'');
    return `<button class="tono-op${cur}" onclick="irTono(${delta})">${etq}</button>`;
  }).join("");
  document.getElementById('bg-tono').classList.add('open');
  document.getElementById('sheet-tono').classList.add('open');
}
function cerrarTono(){ document.getElementById('bg-tono').classList.remove('open'); document.getElementById('sheet-tono').classList.remove('open'); }

function htmlTono(){
  if(!permitirTransposicion){
    return cancion.tono ? `<span class="tono-chip">${esc(nombreTono(0))}</span>` : '';
  }
  return `<button class="tono-btn" onclick="abrirTono()">${esc(nombreTono(semitonosActual))}<span class="cx">▾</span></button>`;
}

// ---- Tamaño ----
const NIVELES = ["xs","s","m","l","xl"];
let nivelTamano = NIVELES.indexOf(localStorage.getItem("charts_tam") || "m");
if(nivelTamano < 0) nivelTamano = 2;
function aplicarTamano(){ document.body.dataset.size = NIVELES[nivelTamano]; localStorage.setItem("charts_tam", NIVELES[nivelTamano]); refrescarTam(); }
function tamanoMenos(){ if(nivelTamano>0){ nivelTamano--; aplicarTamano(); } }
function tamanoMas(){ if(nivelTamano<NIVELES.length-1){ nivelTamano++; aplicarTamano(); } }
function refrescarTam(){
  const lb=document.getElementById("size-label"); if(lb) lb.textContent=NIVELES[nivelTamano].toUpperCase();
  const bm=document.getElementById("size-minus"); if(bm) bm.disabled=(nivelTamano===0);
  const bp=document.getElementById("size-plus"); if(bp) bp.disabled=(nivelTamano===NIVELES.length-1);
}
function abrirAjustes(){ refrescarTam(); document.getElementById('bg-ajustes').classList.add('open'); document.getElementById('sheet-ajustes').classList.add('open'); }
function cerrarAjustes(){ document.getElementById('bg-ajustes').classList.remove('open'); document.getElementById('sheet-ajustes').classList.remove('open'); }
aplicarTamano();

// ---- Preferencias de vista (tema, modo, color y grosor de acordes) ----
const VISTA = { tema:'oscuro', modo:'ambos', color:'', grosor:'700' };
function cargarVista(){
  try{
    VISTA.tema = localStorage.getItem('charts_tema') || 'oscuro';
    VISTA.modo = localStorage.getItem('charts_modo') || 'ambos';
    VISTA.color = localStorage.getItem('charts_color') || '';
    VISTA.grosor = localStorage.getItem('charts_grosor') || 'normal';
    if(['fino','normal','grueso'].indexOf(VISTA.grosor) < 0) VISTA.grosor = 'normal';
  }catch(e){}
  aplicarVista();
}
function aplicarVista(){
  document.body.classList.toggle('claro', VISTA.tema==='claro');
  document.body.classList.toggle('solo-acordes', VISTA.modo==='acordes');
  document.body.classList.toggle('solo-letra', VISTA.modo==='letra');
  if(VISTA.color){ document.body.style.setProperty('--chord-color', VISTA.color); }
  else { document.body.style.removeProperty('--chord-color'); }
  document.body.dataset.grosor = VISTA.grosor;
  marcarV('seg-tema', VISTA.tema);
  marcarV('seg-modo', VISTA.modo);
  marcarV('seg-color', VISTA.color);
  marcarV('seg-grosor', VISTA.grosor);
}
function marcarV(id,val){ const s=document.getElementById(id); if(!s) return; s.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b.dataset.val===val)); }
function setVista(clave,val){ VISTA[clave]=val; try{ localStorage.setItem('charts_'+clave, val); }catch(e){} aplicarVista(); }
cargarVista();
function hexRgbaV(hex,a){ var h=hex.replace('#',''); if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; return 'rgba('+parseInt(h.substr(0,2),16)+','+parseInt(h.substr(2,2),16)+','+parseInt(h.substr(4,2),16)+','+a+')'; }
function inkFor(hex){ var h=hex.replace('#',''); if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16); return (0.299*r+0.587*g+0.114*b)>145?'#000':'#fff'; }
function aplicarAcento(){
  var c=null; try{ c=localStorage.getItem('mw_acento'); }catch(e){}
  var d=document.documentElement.style;
  if(c){ d.setProperty('--gold',c); d.setProperty('--gold-soft', hexRgbaV(c,0.16)); d.setProperty('--gold-ink', inkFor(c)); }
  else { d.removeProperty('--gold'); d.removeProperty('--gold-soft'); d.removeProperty('--gold-ink'); }
  marcarV('seg-acento', c||'');
  var ci=document.getElementById('acento-custom-v'); if(ci){ ci.value=(c&&/^#[0-9a-fA-F]{6}$/.test(c))?c:'#C9A96E'; }
}
function setAcento(val){ try{ if(val) localStorage.setItem('mw_acento',val); else localStorage.removeItem('mw_acento'); }catch(e){} try{ fetch('/api/perfil/acento',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acento:val||''})}); }catch(e){} aplicarAcento(); }
aplicarAcento();

function renderLines(lines){
  return `<div class="lyrics">${(lines||[]).map(line => `
    <div class="line">
      ${line.map(tok => `<div class="tok">
        <span class="chord">${esc(tok[0])}</span>
        <span class="lyric">${tok[1] ? esc(tok[1]) : "\u00A0"}</span>
      </div>`).join("")}
    </div>`).join("")}</div>`;
}
function renderBody(sec){
  if(sec.inst && sec.prog){
    return `<div class="inst-label">Instrumental</div>
      <div class="inst">${sec.prog.map(a => `<span class="chip">${esc(a)}</span>`).join("")}</div>`;
  }
  return renderLines(sec.lines);
}
function renderNextPreview(sigSec){
  if(!sigSec){ return `<div class="nextpreview"><div class="np-tag">Sigue</div><div class="np-end">Fin de la canción</div></div>`; }
  let contenido;
  if(sigSec.inst && sigSec.prog){
    const acordes = sigSec.prog.slice(0,4).map(a=>esc(a)).join("  ");
    contenido = `<div class="np-inst">${acordes}${sigSec.prog.length>4?"  ...":""}</div>`;
  } else if(sigSec.lines && sigSec.lines.length>0){
    const primeraLinea = sigSec.lines[0] || [];
    contenido = `<div class="np-line">${primeraLinea.map(tok=>`
      <div class="np-tok"><span class="np-chord">${esc(tok[0])}</span><span class="np-lyric">${esc(tok[1])}</span></div>`).join("")}</div>`;
  } else { contenido = `<div class="np-end">(sin contenido)</div>`; }
  return `<div class="nextpreview"><div class="np-tag">Sigue</div><div class="np-name">${esc(sigSec.tipo)}</div>${contenido}</div>`;
}

function render(){
  const sec = cancion.secciones[idx];
  const nextSec = cancion.secciones[idx+1];
  app.innerHTML = `
    <div class="topbar">
      <div style="min-width:0;flex:1">
        <div class="song-title-row">
          <div class="song-title">${esc(cancion.titulo)}</div>
          ${htmlTono()}
        </div>
        <div class="song-meta">${cancion.tempo} BPM · ${esc(cancion.compas)}</div>
      </div>
      <div class="right">
        <button class="dots-btn" onclick="abrirAjustes()" title="Ajustes">⋯</button>
        <span class="pos">${idx+1} / ${cancion.secciones.length}</span>
      </div>
    </div>
    <div class="timeline-wrap">
      <div class="timeline">
        ${cancion.secciones.map((s,i)=>`<span class="pill ${i===idx?'active':(i<idx?'done':'')}" onclick="jump(${i})">${esc(s.tipo)}</span>`).join("")}
      </div>
    </div>
    <div class="stage" id="stage">
      ${cancion.secciones.map((s,i)=>`
        <div class="sec" id="sec-${i}" data-idx="${i}">
          <div class="sechead">${esc(s.tipo)}</div>
          ${s.nota?`<div class="secnote">${esc(s.nota)}</div>`:``}
          ${renderBody(s)}
        </div>`).join("")}
    </div>
    <div class="footer">
      <button class="btn-icon" id="btn-prev" onclick="prev()" ${idx===0?'disabled':''}>‹</button>
      <button class="btn-mid" onclick="window.location.href='{{ volver_url }}'">← Atrás</button>
      <button class="btn-icon" id="btn-next" onclick="next()" ${idx===cancion.secciones.length-1?'disabled':''}>›</button>
      <button class="btn-icon ensayo" id="ensayo-fab" title="Modo ensayo">🎧</button>
    </div>`;
  const st = document.getElementById("stage");
  if(st) st.addEventListener("scroll", onStageScroll, {passive:true});
  requestAnimationFrame(()=>setActive(idx, false));
}

let programmaticScroll = false, scrollSyncTimer = null;

function paintActive(){
  document.querySelectorAll(".pill").forEach((pl,pi)=>{ pl.classList.toggle("active", pi===idx); pl.classList.toggle("done", pi<idx); });
  document.querySelectorAll(".sec").forEach((sc,si)=> sc.classList.toggle("active", si===idx));
  const pos=document.querySelector(".pos"); if(pos) pos.textContent=(idx+1)+" / "+cancion.secciones.length;
  const bp=document.getElementById("btn-prev"); if(bp) bp.disabled=(idx===0);
  const bn=document.getElementById("btn-next"); if(bn) bn.disabled=(idx===cancion.secciones.length-1);
  const ap=document.querySelector(".pill.active"); if(ap) ap.scrollIntoView({inline:"center",block:"nearest"});
}

function setActive(i, smooth){
  if(i<0) i=0; if(i>=cancion.secciones.length) i=cancion.secciones.length-1;
  idx=i; paintActive();
  const stage=document.getElementById("stage"), target=document.getElementById("sec-"+idx);
  if(stage && target){
    const base = stage.firstElementChild ? stage.firstElementChild.offsetTop : 0;
    programmaticScroll = true;
    stage.scrollTo({ top: target.offsetTop - base, behavior: smooth?"smooth":"auto" });
    clearTimeout(scrollSyncTimer);
    scrollSyncTimer = setTimeout(()=>{ programmaticScroll=false; }, smooth?500:60);
  }
}

function onStageScroll(){
  if(programmaticScroll) return;
  const stage=document.getElementById("stage"); if(!stage) return;
  const base = stage.firstElementChild ? stage.firstElementChild.offsetTop : 0;
  const y = stage.scrollTop + 10;
  let cur=0; const secs=document.querySelectorAll(".sec");
  for(let i=0;i<secs.length;i++){ if(secs[i].offsetTop - base <= y) cur=i; else break; }
  if(cur!==idx){ idx=cur; paintActive(); }
}

function jump(i){ setActive(i, true); }
function next(){ if(idx < cancion.secciones.length-1) setActive(idx+1, true); }
function prev(){ if(idx > 0) setActive(idx-1, true); }

document.addEventListener("keydown", e => {
  if(e.key === "ArrowRight" || e.key === " "){ next(); e.preventDefault(); }
  else if(e.key === "ArrowLeft"){ prev(); e.preventDefault(); }
});

const app = document.getElementById("app");
render();
</script>

</body>
