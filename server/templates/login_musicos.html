<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso · {{ org_nombre }}</title>
<style>
  :root{
    --bg:#0a0a0a; --surface:#141414; --raised:#1f1f1f; --line:#2a2a2a;
    --txt:#ffffff; --txt2:#a3a3a3; --txt3:#666666;
    --accent:#ffffff;
    --gold:#C9A96E;
    --error:#dc6262;
    --success:#86B36A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,Roboto,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:36px 28px 28px;width:100%;max-width:380px}
  .logo{display:block;width:90px;height:90px;border-radius:50%;margin:0 auto 18px;
    background:#fff;padding:4px;object-fit:contain}
  h1{font-size:18px;font-weight:600;text-align:center;margin-bottom:4px;letter-spacing:0.3px}
  .sub{font-size:13px;color:var(--txt2);margin-bottom:28px;text-align:center}
  label{display:block;font-size:11px;color:var(--txt2);margin-bottom:6px;
    text-transform:uppercase;letter-spacing:1.2px;font-weight:500}
  input{width:100%;padding:12px 14px;font-size:15px;background:var(--raised);
    border:1px solid var(--line);border-radius:8px;color:var(--txt);font-family:inherit;
    transition:border 0.15s;margin-bottom:14px}
  input:focus{outline:none;border-color:var(--txt);background:#252525}
  button{width:100%;margin-top:8px;padding:13px;font-size:14px;font-weight:600;
    background:var(--accent);color:#000;border:none;border-radius:8px;cursor:pointer;
    transition:transform 0.1s;letter-spacing:0.3px}
  button:active{transform:scale(0.985)}
  .flash{padding:11px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;text-align:center;border:1px solid}
  .flash.error{background:rgba(220,98,98,0.12);color:var(--error);border-color:rgba(220,98,98,0.25)}
  .flash.success{background:rgba(134,179,106,0.1);color:var(--success);border-color:rgba(134,179,106,0.3)}
  .links{margin-top:22px;text-align:center;font-size:12px;color:var(--txt3)}
  .links a{color:var(--gold);text-decoration:none;font-weight:500}
  .links a:hover{text-decoration:underline}
  .divider{margin:18px 0;text-align:center;font-size:11px;color:var(--txt3);position:relative}
  .divider::before,.divider::after{content:"";position:absolute;top:50%;width:35%;height:1px;background:var(--line)}
  .divider::before{left:0}.divider::after{right:0}
  .admin-link{display:block;margin-top:18px;text-align:center;font-size:11px;
    color:var(--txt3);text-decoration:none;letter-spacing:0.5px}
  .admin-link:hover{color:var(--txt2)}
</style>
<script>/*mw-acento*/(function(){try{var s="{{ mi_acento }}";var c=s||localStorage.getItem('mw_acento');if(s){try{localStorage.setItem('mw_acento',s);}catch(_){}}if(c){var d=document.documentElement.style,h=c.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];d.setProperty('--gold',c);d.setProperty('--gold-soft','rgba('+parseInt(h.substr(0,2),16)+','+parseInt(h.substr(2,2),16)+','+parseInt(h.substr(4,2),16)+',0.16)');}}catch(e){}})();</script>
</head>
<body>
<div class="card">
  <img src="{{ url_for('static', filename='logo.png') }}?v={{ logo_ver }}" alt="{{ org_nombre }}" class="logo">
  <h1>{{ org_nombre }}</h1>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="flash {{ category }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
<input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" autocomplete="email" autofocus required>
    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit">Ingresar</button>
  </form>

  <div class="links">
    <a href="{{ url_for('olvide_password') }}">¿Olvidaste tu contraseña?</a>
  </div>
  <div class="divider">o</div>
  <div class="links">
    ¿No tenés cuenta? <a href="{{ url_for('registro') }}">Crear una</a>
  </div>

  <a class="admin-link" href="{{ url_for('admin_login') }}">Acceso administrador →</a>
</div>
</body>
</html>
