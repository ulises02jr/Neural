<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restablecer contraseña</title>
<style>
  :root{--bg:#0a0a0a;--surface:#141414;--raised:#1f1f1f;--line:#2a2a2a;
    --txt:#ffffff;--txt2:#a3a3a3;--txt3:#666666;--accent:#ffffff;
    --gold:#C9A96E;--error:#dc6262;--success:#86B36A}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,Roboto,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:36px 28px;width:100%;max-width:380px}
  .logo{display:block;width:72px;height:72px;border-radius:50%;margin:0 auto 14px;
    background:#fff;padding:3px;object-fit:contain}
  h1{font-size:17px;font-weight:600;text-align:center;margin-bottom:6px}
  .sub{font-size:13px;color:var(--txt2);margin-bottom:22px;text-align:center;line-height:1.5}
  label{display:block;font-size:11px;color:var(--txt2);margin:0 0 6px;
    text-transform:uppercase;letter-spacing:1.2px;font-weight:500}
  input{width:100%;padding:12px 14px;font-size:14px;background:var(--raised);
    border:1px solid var(--line);border-radius:7px;color:var(--txt);font-family:inherit}
  input:focus{outline:none;border-color:var(--txt)}
  button{width:100%;margin-top:18px;padding:13px;font-size:14px;font-weight:600;
    background:var(--accent);color:#000;border:none;border-radius:8px;cursor:pointer}
  .flash{padding:10px 12px;border-radius:7px;font-size:13px;margin-bottom:14px;text-align:center;border:1px solid}
  .flash.error{background:rgba(220,98,98,0.12);color:var(--error);border-color:rgba(220,98,98,0.25)}
  .flash.success{background:rgba(134,179,106,0.1);color:var(--success);border-color:rgba(134,179,106,0.3)}
  .links{margin-top:18px;text-align:center;font-size:12px;color:var(--txt3)}
  .links a{color:var(--gold);text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <img src="{{ url_for('static', filename='logo.png') }}?v={{ logo_ver }}" alt="" class="logo">
  <h1>Restablecer contraseña</h1>
  <p class="sub">Te enviaremos un código a tu email para que puedas crear una nueva contraseña.</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="flash {{ category }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
    <label for="email">Email de tu cuenta</label>
    <input type="email" id="email" name="email" autocomplete="email" autofocus required>
    <button type="submit">Enviar código</button>
  </form>

  <div class="links">
    <a href="{{ url_for('login') }}">← Volver al login</a>
  </div>
</div>
</body>
</html>
