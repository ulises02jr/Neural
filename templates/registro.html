<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta · {{ org_nombre }}</title>
<style>
  :root{--bg:#0a0a0a;--surface:#141414;--raised:#1f1f1f;--line:#2a2a2a;
    --txt:#ffffff;--txt2:#a3a3a3;--txt3:#666666;--accent:#ffffff;
    --gold:#C9A96E;--error:#dc6262;--success:#86B36A}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,Roboto,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:32px 28px;width:100%;max-width:420px}
  .logo{display:block;width:72px;height:72px;border-radius:50%;margin:0 auto 14px;
    background:#fff;padding:3px;object-fit:contain}
  h1{font-size:17px;font-weight:600;text-align:center;margin-bottom:4px}
  .sub{font-size:12px;color:var(--txt2);margin-bottom:22px;text-align:center}
  label{display:block;font-size:11px;color:var(--txt2);margin:0 0 6px;
    text-transform:uppercase;letter-spacing:1.2px;font-weight:500}
  input{width:100%;padding:11px 13px;font-size:14px;background:var(--raised);
    border:1px solid var(--line);border-radius:7px;color:var(--txt);font-family:inherit;margin-bottom:12px}
  input:focus{outline:none;border-color:var(--txt)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row label{margin-bottom:6px}
  button{width:100%;margin-top:10px;padding:13px;font-size:14px;font-weight:600;
    background:var(--accent);color:#000;border:none;border-radius:8px;cursor:pointer}
  .flash{padding:10px 12px;border-radius:7px;font-size:13px;margin-bottom:14px;text-align:center;border:1px solid}
  .flash.error{background:rgba(220,98,98,0.12);color:var(--error);border-color:rgba(220,98,98,0.25)}
  .flash.success{background:rgba(134,179,106,0.1);color:var(--success);border-color:rgba(134,179,106,0.3)}
  .links{margin-top:18px;text-align:center;font-size:12px;color:var(--txt3)}
  .links a{color:var(--gold);text-decoration:none;font-weight:500}
  .info{background:rgba(201,169,110,0.08);border:1px solid rgba(201,169,110,0.2);
    color:var(--gold);font-size:12px;padding:10px 12px;border-radius:7px;margin-bottom:18px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <img src="{{ url_for('static', filename='logo.png') }}?v={{ logo_ver }}" alt="" class="logo">
  <h1>Crear cuenta</h1>
  <p class="sub">{{ org_nombre }} · Charts</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="flash {{ category }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <div class="info">
    Después de crear tu cuenta, un administrador debe aprobarla antes de que puedas ingresar.
  </div>

  <form method="POST">
    <div class="row">
      <div>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" value="{{ nombre|default('') }}" required maxlength="40">
      </div>
      <div>
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" name="apellido" value="{{ apellido|default('') }}" required maxlength="40">
      </div>
    </div>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email|default('') }}" autocomplete="email" required>
    <label for="password">Contraseña <span style="color:var(--txt3);text-transform:none;letter-spacing:0">(mínimo 6 caracteres)</span></label>
    <input type="password" id="password" name="password" autocomplete="new-password" required minlength="6">
    <label for="password2">Repetir contraseña</label>
    <input type="password" id="password2" name="password2" autocomplete="new-password" required minlength="6">
    <button type="submit">Crear cuenta</button>
  </form>

  <div class="links">
    ¿Ya tenés cuenta? <a href="{{ url_for('login') }}">Ingresá acá</a>
  </div>
</div>
</body>
</html>
