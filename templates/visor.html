<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>{{ cancion.titulo }}</title>
<style>
  :root{
    --bg:#0a0a0a; --surface:#141414; --raised:#1f1f1f; --line:#2a2a2a;
    --txt:#ffffff; --txt2:#a3a3a3; --txt3:#666666;
    --gold:#C9A96E; --gold-soft:#2a2418;
    --lyric-size:18px; --chord-size:17px; --chord-min:21px;
  }
  body[data-size="xs"]{ --lyric-size:14px; --chord-size:13px; --chord-min:17px; }
  body[data-size="s"] { --lyric-size:16px; --chord-size:15px; --chord-min:19px; }
  body[data-size="m"] { --lyric-size:18px; --chord-size:17px; --chord-min:21px; }
  body[data-size="l"] { --lyric-size:22px; --chord-size:20px; --chord-min:24px; }
  body[data-size="xl"]{ --lyric-size:26px; --chord-size:24px; --chord-min:28px; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,Roboto,sans-serif;line-height:1.5}
  .wrap{height:100dvh;display:flex;flex-direction:column;padding:14px;
    padding-bottom:max(14px,env(safe-area-inset-bottom))}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:10px}
  .song-title-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .song-title{font-size:17px;font-weight:600;line-height:1.2}
  .tono-chip{display:inline-flex;align-items:center;justify-content:center;
    background:var(--gold);color:#000;font-weight:700;font-size:14px;
    padding:2px 10px;border-radius:5px;font-family:ui-monospace,Menlo,monospace}

  /* Transposición */
  .transpose{display:inline-flex;align-items:stretch;gap:0;background:var(--surface);
    border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-left:6px;
    vertical-align:middle}
  .transpose .t-btn{width:28px;height:28px;background:transparent;border:none;
    color:var(--gold);font-size:16px;font-weight:bold;cursor:pointer;
    font-family:inherit;line-height:1;padding:0;transition:background 0.1s}
  .transpose .t-btn:hover{background:var(--raised)}
  .transpose .t-btn:active{background:var(--gold-soft)}
  .transpose .t-tono{padding:0 10px;display:flex;align-items:center;
    background:var(--gold);color:#000;font-weight:700;font-size:13px;
    font-family:ui-monospace,Menlo,monospace;min-width:38px;justify-content:center;
    border-left:1px solid var(--line);border-right:1px solid var(--line);
    text-decoration:none}
  .transpose .t-tono:hover{filter:brightness(0.92)}
  .transpose-hint{font-size:10px;color:var(--txt3);margin-top:2px;font-style:italic}
  .song-meta{font-size:12px;color:var(--txt2);margin-top:2px}
  .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
  .pos{font-size:12px;color:var(--txt2)}
  .back-link{font-size:12px;color:var(--txt3);text-decoration:none;padding:5px 10px;
    border:1px solid var(--line);border-radius:7px;transition:all 0.15s}
  .back-link:hover{color:var(--txt);border-color:var(--txt2)}

  .timeline-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;
    padding:0 14px 6px;flex-shrink:0;scrollbar-width:none}
  .timeline-wrap::-webkit-scrollbar{display:none}
  .timeline{display:inline-flex;gap:6px;padding-bottom:4px;white-space:nowrap}
  .pill{display:inline-block;padding:6px 12px;border-radius:7px;font-size:13px;
    color:var(--txt2);background:var(--surface);border:1px solid var(--line);
    cursor:pointer;flex-shrink:0;font-family:inherit;transition:all 0.15s}
  .pill.done{color:var(--txt3)}
  .pill.active{color:#000;background:var(--txt);border-color:var(--txt);font-weight:600}

  .stage{flex:1;overflow-y:auto;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:14px 16px;-webkit-overflow-scrolling:touch}
  .eyebrow{font-size:11px;color:var(--gold);font-weight:600;letter-spacing:1.8px;
    text-transform:uppercase;margin-bottom:8px}
  .perfnote{font-size:13px;color:var(--txt2);font-style:italic;margin-bottom:14px;
    padding:9px 13px;background:var(--raised);border-radius:7px;border-left:2px solid var(--gold)}
  .lyrics .line{display:flex;flex-wrap:wrap;align-items:flex-end;margin-bottom:6px}
  .lyrics .tok{display:inline-flex;flex-direction:column}
  .chord{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:var(--chord-size);font-weight:700;color:var(--gold);
    min-height:var(--chord-min);line-height:var(--chord-min);white-space:pre}
  .lyric{font-size:var(--lyric-size);color:var(--txt);line-height:1.35;white-space:pre}
  .inst{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 0}
  .chip{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:var(--chord-size);
    font-weight:700;color:var(--gold);background:var(--gold-soft);
    padding:8px 16px;border-radius:8px;border:1px solid #3d3422}
  .inst-label{font-size:15px;color:var(--txt2);margin-bottom:14px}

  .nextpreview{flex-shrink:0;margin-top:8px;padding:9px 13px;background:var(--raised);
    border:1px solid var(--line);border-radius:8px;border-left:2px solid var(--gold);
    display:flex;flex-direction:column;gap:2px;overflow:hidden}
  .nextpreview .np-tag{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:1.2px;font-weight:600}
  .nextpreview .np-name{font-size:13px;color:var(--gold);font-weight:600}
  .nextpreview .np-line{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px;margin-top:2px;
    max-height:36px;overflow:hidden}
  .nextpreview .np-tok{display:inline-flex;flex-direction:column;margin-right:6px}
  .nextpreview .np-chord{font-family:ui-monospace,Menlo,monospace;font-size:12px;
    font-weight:700;color:var(--gold);line-height:14px;white-space:pre;opacity:0.9}
  .nextpreview .np-lyric{font-size:13px;color:var(--txt2);line-height:1.2;white-space:pre}
  .nextpreview .np-inst{font-size:12px;color:var(--txt2);font-style:italic}
  .nextpreview .np-end{font-size:13px;color:var(--txt2);font-style:italic}

  .footer{display:flex;gap:6px;align-items:center;margin-top:10px;flex-shrink:0}
  .btn-icon{width:48px;height:48px;border-radius:8px;background:var(--surface);
    border:1px solid var(--line);color:var(--txt);font-size:22px;line-height:1;
    cursor:pointer;font-family:inherit;flex-shrink:0;transition:all 0.15s}
  .btn-icon:hover{border-color:var(--txt2)}
  .btn-icon:active{background:var(--raised);transform:scale(0.97)}
  .btn-icon:disabled{opacity:0.3;cursor:not-allowed}
  .btn-mid{flex:1;background:var(--raised);color:var(--txt);border:1px solid var(--line);
    padding:13px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;
    transition:all 0.15s}
  .btn-mid:hover{border-color:var(--txt2)}

  .size-ctrl{display:inline-flex;align-items:center;gap:4px;margin-top:2px}
  .size-btn{width:28px;height:24px;border-radius:6px;background:var(--surface);
    border:1px solid var(--line);color:var(--txt2);font-size:13px;cursor:pointer;
    font-family:inherit;font-weight:600;padding:0;line-height:1}
  .size-btn:active{background:var(--raised);color:var(--txt)}
  .size-btn:disabled{opacity:0.35;cursor:default}
  .size-label{font-size:11px;color:var(--txt3);min-width:14px;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const cancion = {{ cancion|tojson }};
const permitirTransposicion = {{ permitir_transposicion|tojson }};
const semitonosActual = {{ semitonos_actual|tojson }};
const numeroCancion = {{ cancion.numero|tojson }};

// Sección inicial: si la URL trae ?s=N, arrancar ahí (para preservar al transponer)
const urlParams = new URLSearchParams(window.location.search);
let idx = parseInt(urlParams.get('s') || '0', 10);
if(isNaN(idx) || idx < 0 || idx >= cancion.secciones.length) idx = 0;

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function transponer(delta){
  const nuevo = Math.max(-12, Math.min(12, semitonosActual + delta));
  if(nuevo === semitonosActual) return;
  // Mantener la sección actual al transponer
  window.location.href = `/cancion/${numeroCancion}?from=bib&t=${nuevo}&s=${idx}`;
}

function htmlTransposeChip(){
  // Si NO es desde biblioteca, mostrar solo el tono normal
  if(!permitirTransposicion){
    return cancion.tono ? `<span class="tono-chip">${esc(cancion.tono)}</span>` : '';
  }
  // Si es desde biblioteca: chip con +/- alrededor
  return `<span class="transpose">
    <button class="t-btn" onclick="transponer(-1)" title="Bajar 1 semitono" ${semitonosActual<=-12?'disabled':''}>−</button>
    <a class="t-tono" href="/cancion/${numeroCancion}?from=bib&t=0&s=${idx}" title="Volver al tono original">${esc(cancion.tono||'?')}</a>
    <button class="t-btn" onclick="transponer(1)" title="Subir 1 semitono" ${semitonosActual>=12?'disabled':''}>+</button>
  </span>`;
}

const NIVELES = ["xs","s","m","l","xl"];
let nivelTamano = NIVELES.indexOf(localStorage.getItem("charts_tam") || "m");
if(nivelTamano < 0) nivelTamano = 2;
function aplicarTamano(){
  document.body.dataset.size = NIVELES[nivelTamano];
  localStorage.setItem("charts_tam", NIVELES[nivelTamano]);
}
function tamanoMenos(){ if(nivelTamano > 0){ nivelTamano--; aplicarTamano(); refrescarBotonesTamano(); }}
function tamanoMas(){ if(nivelTamano < NIVELES.length-1){ nivelTamano++; aplicarTamano(); refrescarBotonesTamano(); }}
function refrescarBotonesTamano(){
  const bm = document.getElementById("size-minus");
  const bp = document.getElementById("size-plus");
  const lb = document.getElementById("size-label");
  if(bm) bm.disabled = (nivelTamano === 0);
  if(bp) bp.disabled = (nivelTamano === NIVELES.length-1);
  if(lb) lb.textContent = NIVELES[nivelTamano].toUpperCase();
}
function htmlBotonesTamano(){
  return `<div class="size-ctrl">
    <button class="size-btn" id="size-minus" onclick="tamanoMenos()" ${nivelTamano===0?'disabled':''}>A−</button>
    <span class="size-label" id="size-label">${NIVELES[nivelTamano].toUpperCase()}</span>
    <button class="size-btn" id="size-plus" onclick="tamanoMas()" ${nivelTamano===NIVELES.length-1?'disabled':''}>A+</button>
  </div>`;
}
aplicarTamano();

function renderLines(lines){
  return `<div class="lyrics">${(lines||[]).map(line => `
    <div class="line">
      ${line.map(tok => `<div class="tok">
        <span class="chord">${esc(tok[0])}</span>
        <span class="lyric">${esc(tok[1])}</span>
      </div>`).join("")}
    </div>`).join("")}</div>`;
}

function renderBody(sec){
  if(sec.inst && sec.prog){
    return `<div class="inst-label">Instrumental</div>
      <div class="inst">${sec.prog.map(a => `<span class="chip">${esc(a)}</span>`).join("")}</div>`;
  }
  return renderLines(sec.lines);
}

function renderNextPreview(sigSec){
  if(!sigSec){
    return `<div class="nextpreview">
      <div class="np-tag">Sigue</div>
      <div class="np-end">Fin de la canción</div>
    </div>`;
  }
  let contenido;
  if(sigSec.inst && sigSec.prog){
    const acordes = sigSec.prog.slice(0, 4).map(a => esc(a)).join("  ");
    contenido = `<div class="np-inst">${acordes}${sigSec.prog.length > 4 ? "  ..." : ""}</div>`;
  } else if(sigSec.lines && sigSec.lines.length > 0){
    const primeraLinea = sigSec.lines[0] || [];
    contenido = `<div class="np-line">${primeraLinea.map(tok => `
      <div class="np-tok">
        <span class="np-chord">${esc(tok[0])}</span>
        <span class="np-lyric">${esc(tok[1])}</span>
      </div>`).join("")}</div>`;
  } else {
    contenido = `<div class="np-end">(sin contenido)</div>`;
  }
  return `<div class="nextpreview">
    <div class="np-tag">Sigue</div>
    <div class="np-name">${esc(sigSec.tipo)}</div>
    ${contenido}
  </div>`;
}

function render(){
  const sec = cancion.secciones[idx];
  const nextSec = cancion.secciones[idx+1];
  app.innerHTML = `
    <div class="topbar">
      <div style="min-width:0;flex:1">
        <div class="song-title-row">
          <div class="song-title">${esc(cancion.titulo)}</div>
          ${htmlTransposeChip()}
        </div>
        <div class="song-meta">${cancion.tempo} BPM · ${esc(cancion.compas)} · ${esc(cancion.artista||'')}${semitonosActual!==0?' · <span style="color:var(--gold)">'+(semitonosActual>0?'+':'')+semitonosActual+' semitono'+(Math.abs(semitonosActual)>1?'s':'')+'</span>':''}</div>
      </div>
      <div class="right">
        <a href="${permitirTransposicion ? '/?tab=biblioteca' : '/'}" class="back-link">← Volver</a>
        <span class="pos">Sección ${idx+1} / ${cancion.secciones.length}</span>
        ${htmlBotonesTamano()}
      </div>
    </div>
    <div class="timeline-wrap">
      <div class="timeline">
        ${cancion.secciones.map((s,i)=>`<span class="pill ${i===idx?'active':(i<idx?'done':'')}" onclick="jump(${i})">${esc(s.tipo)}</span>`).join("")}
      </div>
    </div>
    <div class="stage">
      <div class="eyebrow">${esc(sec.tipo)}</div>
      ${sec.nota?`<div class="perfnote">${esc(sec.nota)}</div>`:`<div style="height:14px"></div>`}
      ${renderBody(sec)}
    </div>
    ${renderNextPreview(nextSec)}
    <div class="footer">
      <button class="btn-icon" onclick="prev()" ${idx===0?'disabled':''}>‹</button>
      <button class="btn-mid" onclick="window.location.href='/'">Volver al setlist</button>
      <button class="btn-icon" onclick="next()" ${idx===cancion.secciones.length-1?'disabled':''}>›</button>
    </div>`;
  const active = document.querySelector(".pill.active");
  if(active) active.scrollIntoView({inline:"center",block:"nearest"});
  const stage = document.querySelector(".stage");
  if(stage) stage.scrollTop = 0;
}

function jump(i){ idx = i; render(); }
function next(){ if(idx < cancion.secciones.length-1){ idx++; render(); } }
function prev(){ if(idx > 0){ idx--; render(); } }

document.addEventListener("keydown", e => {
  if(e.key === "ArrowRight" || e.key === " "){ next(); e.preventDefault(); }
  else if(e.key === "ArrowLeft"){ prev(); e.preventDefault(); }
});

const app = document.getElementById("app");
render();
</script>
</body>
</html>
